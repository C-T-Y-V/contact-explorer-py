[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contact-explorer"
version = "1.0.0"
description = "Enterprise-grade, privacy-first offline contact explorer and management suite"
readme = "README.md"
authors = [
    { name = "Contact Explorer Core Team", email = "priyanshuctyv@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "contacts",
    "address-book",
    "offline-first",
    "privacy",
    "sqlite",
    "tkinter",
    "vcard",
    "csv",
    "deduplication",
    "desktop-app",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Topic :: Database",
    "Topic :: Office/Business :: Groupware",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/priyanshu-ctyv/contact-explorer-py"
Repository = "https://github.com/priyanshu-ctyv/contact-explorer-py.git"
Documentation = "https://github.com/priyanshu-ctyv/contact-explorer-py#readme"
"Bug Tracker" = "https://github.com/priyanshu-ctyv/contact-explorer-py/issues"
Changelog = "https://github.com/priyanshu-ctyv/contact-explorer-py/blob/main/CHANGELOG.md"

[project.scripts]
contact-explorer = "contact_explorer.ui:launch"
contact-explorer-server = "contact_explorer.api:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["contact_explorer*"]
exclude = ["tests*", "scripts*", "docs*"]

[tool.setuptools.package-data]
contact_explorer = ["py.typed"]

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Ruff Linter & Formatter Configuration
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["contact_explorer"]

# Mypy Type Checker Configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "contact_explorer.*"
disallow_untyped_defs = true

# Coverage Configuration
[tool.coverage.run]
source = ["contact_explorer"]
branch = true
omit = [
    "contact_explorer/ui.py", # Tkinter event loop requires visual display
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
